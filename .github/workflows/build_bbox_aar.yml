name: Build bbox AAR

on:
  workflow_dispatch:
  push:
    branches:
      - ccr-cd35b503-161pck
    paths:
      - 'final_delivery/BboxDeviceResetDirectFb_Fixed.zip'
      - 'bbox_fixes/**'
      - '.github/workflows/build_bbox_aar.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract bbox source
        run: |
          unzip -q final_delivery/BboxDeviceResetDirectFb_Fixed.zip -d /tmp/bbox_build/
          echo "Extracted:"
          ls /tmp/bbox_build/bbox/

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          ndk-version: 24.0.8215888

      - name: Configure local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > /tmp/bbox_build/bbox/local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/24.0.8215888" >> /tmp/bbox_build/bbox/local.properties

      - name: Accept Android licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant gradlew execute permission
        run: chmod +x /tmp/bbox_build/bbox/gradlew

      - name: Build AAR
        run: |
          cd /tmp/bbox_build/bbox
          ./gradlew :MundoCore:assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Find output AAR
        run: find /tmp/bbox_build/bbox -name "*.aar" 2>/dev/null

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: BboxDeviceResetDirectFb-fixed-aar
          path: /tmp/bbox_build/bbox/MundoCore/build/outputs/aar/*.aar
          if-no-files-found: error
          retention-days: 30
