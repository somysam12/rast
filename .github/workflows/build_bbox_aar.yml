name: Build bbox AAR

on:
  workflow_dispatch:
  push:
    branches:
      - ccr-cd35b503-161pck
    paths:
      - 'final_delivery/BboxDeviceResetDirectFb_Fixed.zip'
      - 'bbox_fixes/**'
      - '.github/workflows/build_bbox_aar.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract bbox source
        run: |
          unzip -q final_delivery/BboxDeviceResetDirectFb_Fixed.zip -d /tmp/bbox_build/
          echo "Extracted:"
          ls /tmp/bbox_build/bbox/

      - name: Install Android SDK components
        run: |
          ANDROID_SDK=/usr/local/lib/android/sdk
          echo "SDK root: $ANDROID_SDK"
          ls $ANDROID_SDK/cmdline-tools/
          SDKMANAGER=$(find $ANDROID_SDK/cmdline-tools -name "sdkmanager" | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          $SDKMANAGER "platforms;android-34" "build-tools;34.0.4" "ndk;24.0.8215888"

      - name: Configure local.properties
        run: |
          ANDROID_SDK=/usr/local/lib/android/sdk
          echo "sdk.dir=$ANDROID_SDK" > /tmp/bbox_build/bbox/local.properties
          echo "ndk.dir=$ANDROID_SDK/ndk/24.0.8215888" >> /tmp/bbox_build/bbox/local.properties
          echo "build-tools;34.0.4 installed: $(ls $ANDROID_SDK/build-tools/ 2>/dev/null)"
          cat /tmp/bbox_build/bbox/local.properties

      - name: Grant gradlew execute permission
        run: chmod +x /tmp/bbox_build/bbox/gradlew

      - name: Build AAR
        run: |
          cd /tmp/bbox_build/bbox
          ./gradlew :MundoCore:assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Find output AAR
        run: find /tmp/bbox_build/bbox -name "*.aar" 2>/dev/null

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: BboxDeviceResetDirectFb-fixed-aar
          path: /tmp/bbox_build/bbox/MundoCore/build/outputs/aar/*.aar
          if-no-files-found: error
          retention-days: 30
