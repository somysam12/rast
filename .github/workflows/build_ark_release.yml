name: Build aRkCheat Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - ccr-cd35b503-161pck
    paths:
      - 'final_delivery/aRkCheatSimp_Fixed.zip'
      - 'final_delivery/BboxDeviceResetDirectFb_Fixed.zip'
      - 'bbox_fixes/**'
      - '.github/workflows/build_ark_release.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract both projects
        run: |
          unzip -q final_delivery/BboxDeviceResetDirectFb_Fixed.zip -d /tmp/bbox_build/
          echo "bbox extracted:" && ls /tmp/bbox_build/bbox/
          unzip -q final_delivery/aRkCheatSimp_Fixed.zip -d /tmp/ark_build/
          echo "aRkCheat extracted:" && ls /tmp/ark_build/aRkCheat/

      - name: Install Android SDK components
        run: |
          ANDROID_SDK=/usr/local/lib/android/sdk
          SDKMANAGER=$(find $ANDROID_SDK/cmdline-tools -name "sdkmanager" | head -1)
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          $SDKMANAGER "platforms;android-34" "build-tools;34.0.0" "ndk;24.0.8215888"

      - name: Configure local.properties for bbox
        run: |
          ANDROID_SDK=/usr/local/lib/android/sdk
          echo "sdk.dir=$ANDROID_SDK" > /tmp/bbox_build/bbox/local.properties
          echo "ndk.dir=$ANDROID_SDK/ndk/24.0.8215888" >> /tmp/bbox_build/bbox/local.properties

      - name: Patch buildToolsVersion in MundoCore
        run: |
          sed -i "s/buildToolsVersion = '34\.0\.4'/buildToolsVersion = '34.0.0'/" /tmp/bbox_build/bbox/MundoCore/build.gradle
          grep buildToolsVersion /tmp/bbox_build/bbox/MundoCore/build.gradle

      - name: Grant gradlew execute permission (bbox)
        run: chmod +x /tmp/bbox_build/bbox/gradlew

      - name: Build bbox AAR
        run: |
          cd /tmp/bbox_build/bbox
          ./gradlew :MundoCore:assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Inject fixed AAR into aRkCheat libs
        run: |
          AAR=$(find /tmp/bbox_build/bbox/MundoCore/build/outputs/aar -name "*release*.aar" | head -1)
          echo "Built AAR: $AAR"
          cp "$AAR" /tmp/ark_build/aRkCheat/app/libs/Hcore-release.aar
          echo "Replaced Hcore-release.aar with fixed bbox AAR"
          ls -lh /tmp/ark_build/aRkCheat/app/libs/

      - name: Configure local.properties for aRkCheat
        run: |
          ANDROID_SDK=/usr/local/lib/android/sdk
          echo "sdk.dir=$ANDROID_SDK" > /tmp/ark_build/aRkCheat/local.properties
          echo "ndk.dir=$ANDROID_SDK/ndk/24.0.8215888" >> /tmp/ark_build/aRkCheat/local.properties

      - name: Grant gradlew execute permission (aRkCheat)
        run: chmod +x /tmp/ark_build/aRkCheat/gradlew

      - name: Build Release APK
        run: |
          cd /tmp/ark_build/aRkCheat
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Find output APK
        run: |
          find /tmp/ark_build/aRkCheat -name "*.apk" 2>/dev/null
          ls /tmp/ark_build/aRkCheat/app/build/outputs/apk/release/ 2>/dev/null || true

      - name: Upload fixed AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: BboxDeviceResetDirectFb-fixed-aar
          path: /tmp/bbox_build/bbox/MundoCore/build/outputs/aar/*.aar
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aRkCheat-fixed-release-apk
          path: /tmp/ark_build/aRkCheat/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
